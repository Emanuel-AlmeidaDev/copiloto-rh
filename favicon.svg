<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo escuro: a faixa preta do ônibus -->
  <rect width="64" height="64" rx="14" fill="#16181D"/>
  <!-- Retrovisores -->
  <rect x="6" y="20" width="5" height="10" rx="2" fill="#F2B705"/>
  <rect x="53" y="20" width="5" height="10" rx="2" fill="#F2B705"/>
  <!-- Lataria amarela -->
  <rect x="12" y="9" width="40" height="44" rx="9" fill="#F2B705"/>
  <!-- Para-brisa -->
  <rect x="17" y="15" width="30" height="15" rx="3" fill="#16181D"/>
  <!-- Faixa preta -->
  <rect x="12" y="35" width="40" height="3.5" fill="#16181D"/>
  <!-- Faróis -->
  <circle cx="20" cy="45" r="3.5" fill="#FFF6D6"/>
  <circle cx="44" cy="45" r="3.5" fill="#FFF6D6"/>
  <!-- Grade -->
  <rect x="27" y="43" width="10" height="4" rx="1.5" fill="#16181D"/>
</svg>
